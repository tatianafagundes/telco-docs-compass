openapi: 3.1.0
info:
  title: 'Seam: document'
  version: 0.1.0
  description: >-
    Document metadata, versions, access, retention and extraction behind one stable bean. Aligned to TM Forum TMF667 v5.
    Metadata only: the binary is reached through short-lived signed URLs and never crosses Journey Mesh.
    The tenant comes from the signed token, never from a header or the body (ADR-010).
x-seam:
  beanName: documentSeam
  recommendedMechanism: connector
  mechanismNote: >-
    Connector Microservice by ADR-002 rule (a): one operation spans two backends, a metadata store (TMF667 server or
    own store) and a content store (SharePoint, Box, S3). Add an adapter only where a tenant keeps both in one REST system.
    In the Lovable prototype both are Supabase (Postgres + Storage).
  bpmnExpression: ${documentSeam.<operationId>(journeyContextDTO)}
  versioning: semver; deprecia, nunca remove (ADR-008)
  valuePacksMerge: >-
    This file is hand-written in OpenAPI 3.1 idiom (path-level parameters, parameter $refs, fragment $refs into the
    model). The Value packs seams are GENERATED by contracts/tools/build_contracts.py from SEAMDEFS/CAPS and their
    lint_contracts.py only recognises an inline Idempotency-Key parameter per operation and whole-file $refs.
    To merge: add a 'document' entry to SEAMDEFS and CAPS (capabilities below, with obligations nativeVersions=false,
    holdEnforcement=metadataOnly and eventDelivery=polling -> store durable) and let the builder regenerate this
    contract and the binding schema; do not copy this file into the Value packs tree as is.
  multiTenancy:
    tenantSource: signed scope token
    bindingPerTenant: true
    configInheritance: tenant-policy.schema.json (master tenant owns shared specifications; children inherit, extend, override or are locked)
    documentsCrossTenant: never, except an explicit audited grant
  capabilities:
    contentUrl:
      values: [signed, proxied]
      default: proxied
      ask: Does the content store hand out time-limited URLs the browser can use directly (signed), or must content pass through a proxy we run (proxied)?
      flow:
        signed: register and getContentUrl return a URL; the channel uploads and downloads directly
        proxied: the connector exposes upload and download endpoints and streams; slower, same contract
      evidence: Supabase Storage and S3 support signed URLs; SharePoint via Graph createUploadSession / download URL (to confirm per tenant)
    nativeVersions:
      values: [true, false]
      default: false
      ask: Does the content store keep every version immutably, or must the connector keep them (copy on write)?
      flow:
        true: addVersion maps to a store version
        false: addVersion writes a new object keyed by content hash and the connector keeps the version list
      evidence: SharePoint and Box keep versions; plain S3 needs bucket versioning
    holdEnforcement:
      values: [storage, metadataOnly]
      default: metadataOnly
      ask: Can the content store itself refuse deletion under hold, or only our metadata layer?
      flow:
        storage: setHold also locks the object (for example retention lock)
        metadataOnly: the seam refuses deletes and says so; the store is not locked
      evidence: SharePoint retention and eDiscovery hold protect versions from pruning (Microsoft Learn)
    malwareScan:
      values: [inline, async, none]
      default: async
      ask: Is the file scanned before it can be served, after upload, or not at all?
      flow:
        inline: pipelineState goes scanning then reading
        async: same, with a delay the channel shows
        none: the seam must not be bound in production
    extraction:
      values: [true, false]
      default: false
      ask: Is there an extraction provider behind getExtraction?
      flow:
        true: pipelineState passes reading; fields carry confidence and source
        false: getExtraction returns an empty list and the channel hides the review screen
    fullTextSearch:
      values: [none, keyword, hybrid]
      default: keyword
      ask: Does search read file text, and does it add meaning-based matching?
      flow:
        none: find filters on metadata only
        keyword: find also matches extracted text
        hybrid: keyword plus semantic ranking; the permission filter is applied before retrieval
    eventDelivery:
      values: [webhook, polling]
      default: polling
      ask: Does the backend push document events, or must the connector poll?
      flow:
        webhook: documentCreate, documentStateChange, attachmentCreate and pipelineStateChange go to notificationSeam.publishEvent
        polling: the connector polls and publishes the same events
paths:
  /documents:
    post:
      operationId: register
      summary: Creates a document and its first version slot
      x-tmf667: POST /document + POST /attachment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created. Same body for the same Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          description: Same key, different body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeamError'
        default:
          $ref: '#/components/responses/Failure'
  /documents/search:
    post:
      operationId: find
      x-safe: true
      x-safeNote: Read-only POST, used so search text never lands in a URL. The Value packs lint requires Idempotency-Key on non-safe operations; add an exemption for x-safe when merging this contract there.
      summary: Finds documents by entity, type, status, text. Body, not query string, so no personal data lands in URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindRequest'
      responses:
        '200':
          description: Page of documents the caller may see. Permission filter is applied before retrieval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindResponse'
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: get
      summary: Reads one document with its current version
      x-tmf667: GET /document/{id}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '../model/document.schema.json'
        '404':
          $ref: '#/components/responses/Failure'
        default:
          $ref: '#/components/responses/Failure'
    patch:
      operationId: updateMetadata
      summary: Merges the fields sent. Never regresses a terminal status
      x-tmf667: PATCH /document/{id}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/MetadataPatch'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '../model/document.schema.json'
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/versions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: listVersions
      summary: Lists versions, newest first, automatic checkpoints and named versions
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../model/document.schema.json#/$defs/DocumentVersion'
        default:
          $ref: '#/components/responses/Failure'
    post:
      operationId: addVersion
      summary: Adds an immutable version; returns where to upload. A restore is also an addVersion that copies an earlier one
      x-tmf667: POST /attachment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddVersionRequest'
      responses:
        '201':
          description: Version slot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '409':
          description: Document is superseded, expired, archived or on hold for edits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeamError'
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/versions/{versionId}/content:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: versionId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getContentUrl
      summary: Returns a short-lived URL to read or preview one version. Refused while quarantined or scanning
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentUrl'
        '423':
          description: Quarantined or still scanning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeamError'
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/transitions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: transition
      summary: Moves the lifecycle status. Rules come from the effective specification and the master's locked workflow
      x-tmf667: documentStateChangeEvent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '../model/document.schema.json'
        '409':
          description: Transition not allowed from the current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeamError'
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/hold:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    put:
      operationId: setHold
      summary: Sets or releases a legal hold. A hold blocks hard delete and pruning of versions
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              additionalProperties: false
              properties:
                active:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '../model/document.schema.json'
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/delete:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: delete
      summary: Soft-deletes (sets deletedAt). Refused with a reason under legal hold or retention. Recoverable with restoreDeleted
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '../model/document.schema.json'
        '409':
          description: Legal hold or retention blocks deletion; customerFacing.key names the reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeamError'
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/restore-deleted:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: restoreDeleted
      summary: Undoes a soft delete (clears deletedAt)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '../model/document.schema.json'
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/problems:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: reportProblem
      summary: Reports a problem with the document. kind=security goes to the tenant's security contact; kind=sendBack returns an in_review document to draft (the one allowed backward transition)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, reason]
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum: [security, unreadable, sendBack]
                reason:
                  type: string
                  enum: [threat, wrongDocument, wrongEntity, unreadablePages, other]
                comment:
                  type: string
                  maxLength: 280
      responses:
        '202':
          description: Recorded (audit action report)
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/access/grants:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: grantAccess
      summary: Adds an explicit exception for a user, or a cross-tenant grant to a named tenant (manager or above; reason and expiry required for a tenant)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, level]
              additionalProperties: false
              properties:
                subject:
                  type: object
                  required: [type, id]
                  properties:
                    type:
                      type: string
                      enum: [user, tenant]
                    id:
                      type: string
                level:
                  type: string
                  enum: [view, edit]
                expiresAt:
                  type: string
                  format: date-time
                reason:
                  type: string
                  maxLength: 160
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrant'
        default:
          $ref: '#/components/responses/Failure'
    delete:
      operationId: revokeAccess
      summary: Removes an explicit exception or revokes a cross-tenant grant
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject:
                  type: object
                  required: [type, id]
                  properties:
                    type:
                      type: string
                      enum: [user, tenant]
                    id:
                      type: string
      responses:
        '204':
          description: ok
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/access:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: listAccess
      summary: Who can see the document and why, inherited from an entity versus an explicit exception
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessGrant'
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/access-events:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: recordAccess
      summary: Appends an audit entry (view, download, share, status change). Never carries the document body
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessEvent'
      responses:
        '202':
          description: ok
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/extraction:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getExtraction
      summary: Fields read from the current version, with confidence and source
      responses:
        '200':
          description: ok. Empty list when extraction is false.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../model/extraction-field.schema.json'
        default:
          $ref: '#/components/responses/Failure'
  /documents/{documentId}/extraction/{fieldId}/review:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: fieldId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: reviewExtraction
      summary: Accepts, edits or rejects one extracted field. Keeps the original value when edited
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision:
                  type: string
                  enum: [accept, edit, reject]
                value: {}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '../model/extraction-field.schema.json'
        default:
          $ref: '#/components/responses/Failure'
  /specifications:
    get:
      operationId: listSpecifications
      summary: Document types in force for the calling tenant (master merged with child), each with its origin
      x-tmf667: GET /documentSpecification
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../model/document-specification.schema.json'
        default:
          $ref: '#/components/responses/Failure'
  /tenant-policy:
    get:
      operationId: getTenantPolicy
      summary: The calling tenant's role, parent, isolation and inheritance rules, and hard floors set by the master
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '../model/tenant-policy.schema.json'
        default:
          $ref: '#/components/responses/Failure'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: <requestId>:<seam>.<operation>. The engine re-runs failed jobs; the implementation must return the same result for the same key and 409 for the same key with a different body (ADR-012).
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
  responses:
    Failure:
      description: Failure. Backend code, message and stack never leave the implementation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SeamError'
  schemas:
    SeamError:
      type: object
      required: [code, category, retryable]
      properties:
        code:
          type: string
          description: Stable code of the seam, never the backend's
        category:
          type: string
          enum: [validation, notFound, conflict, rejected, unavailable, unknown]
        retryable:
          type: boolean
        message:
          type: string
          description: Diagnostic for operations. Never shown to the customer
        customerFacing:
          type: object
          properties:
            key:
              type: string
            recoverable:
              type: boolean
            nextAction:
              type: string
              enum: [retry, fixInput, contactSupport, none]
    RegisterRequest:
      type: object
      required: [name, documentType, relatedEntity, mimeType]
      additionalProperties: false
      properties:
        name:
          type: string
        documentType:
          type: string
        relatedEntity:
          $ref: '../model/document.schema.json#/properties/relatedEntity'
        mimeType:
          type: string
        size:
          type: integer
        sensitivity:
          type: string
        characteristic:
          $ref: '../model/document.schema.json#/properties/characteristic'
    RegisterResponse:
      type: object
      required: [document, upload]
      properties:
        document:
          $ref: '../model/document.schema.json'
        upload:
          $ref: '#/components/schemas/UploadTicket'
    UploadTicket:
      type: object
      required: [versionId, method, expiresAt]
      properties:
        versionId:
          type: string
        method:
          type: string
          enum: [signedUrl, proxied]
        url:
          type: string
          description: Short-lived. Never logged.
        expiresAt:
          type: string
          format: date-time
    ContentUrl:
      type: object
      required: [url, expiresAt, mimeType]
      properties:
        url:
          type: string
          description: Short-lived. Never logged.
        expiresAt:
          type: string
          format: date-time
        mimeType:
          type: string
        previewable:
          type: boolean
    AddVersionRequest:
      type: object
      required: [mimeType]
      additionalProperties: false
      properties:
        mimeType:
          type: string
        label:
          type: string
        note:
          type: string
        restoreFromVersionId:
          type: string
        isNamed:
          type: boolean
    MetadataPatch:
      type: object
      additionalProperties: false
      properties:
        keepUnread:
          type: boolean
          description: After a failed read, keep the file as an attachment with no extraction; pipelineState becomes ready with the note "Not read".
        name:
          type: string
        description:
          type: string
        sensitivity:
          type: string
        expiryDate:
          type: string
          format: date
        characteristic:
          $ref: '../model/document.schema.json#/properties/characteristic'
    TransitionRequest:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to:
          $ref: '../model/document.schema.json#/properties/status'
        comment:
          type: string
    FindRequest:
      type: object
      additionalProperties: false
      properties:
        entity:
          type: object
          properties:
            id:
              type: string
            referredType:
              type: string
        party:
          type: object
          description: All documents linked to a customer or party role, as in the TMF667 v5 guide's sample use case (identification documents of a customer). Ids are opaque and never personal data.
          properties:
            id:
              type: string
            referredType:
              type: string
              enum: [PartyRole, Individual, Organization]
        documentType:
          type: array
          items:
            type: string
        status:
          type: array
          items:
            type: string
        pipelineState:
          type: array
          items:
            type: string
        text:
          type: string
          description: Exact match is tried first for contract and order numbers
        pageSize:
          type: integer
          maximum: 100
        pageToken:
          type: string
    FindResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '../model/document.schema.json'
        nextPageToken:
          type: string
        total:
          type: integer
    AccessGrant:
      type: object
      required: [subject, level, source]
      properties:
        subject:
          type: object
          properties:
            type:
              type: string
              enum: [user, team, role, tenant]
            id:
              type: string
            displayName:
              type: string
        level:
          type: string
          enum: [view, edit, manage]
        source:
          type: string
          enum: [inheritedFromEntity, explicit, masterSupervision, crossTenantGrant]
        viaEntity:
          type: object
          properties:
            id:
              type: string
            referredType:
              type: string
        grantedBy:
          type: string
        expiresAt:
          type: string
          format: date-time
    AccessEvent:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [view, download, share, statusChange, restore, hold, delete, undelete, accessDenied, upload, pipelineStateChange, report, accessGranted, accessRevoked, fieldReviewed, configChange]
        versionId:
          type: string
        detail:
          type: string
          description: Short, no personal data
